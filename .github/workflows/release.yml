name: release-appliance-images

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test -- --run
      - run: bash deploy/appliance/tests/smoke.sh

  build-and-push:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: quote-ops-agent
            dockerfile: deploy/appliance/Dockerfile
            build_args: |
              QUOTEOPS_SERVICE=agent
          - image: quote-ops-api
            dockerfile: deploy/appliance/Dockerfile
            build_args: |
              QUOTEOPS_SERVICE=api
          - image: quote-ops-web
            dockerfile: deploy/appliance/Dockerfile.web
            build_args: ""
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          # ponytail: amd64-only — QEMU arm64 flakes (esbuild hang, npm SIGILL);
          # arm64 needs native arm64 runners or npm cross-install (--cpu/--os/--libc)
          platforms: linux/amd64
          push: true
          build-args: ${{ matrix.build_args }}
          tags: ghcr.io/alejandroc-bit/${{ matrix.image }}:${{ github.ref_name }}

  verify-anonymous-pulls:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: docker/setup-buildx-action@v3
      - name: Require anonymously pullable immutable application images
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          for image in quote-ops-agent quote-ops-api quote-ops-web; do
            repository="ghcr.io/alejandroc-bit/$image"
            digest="$(docker buildx imagetools inspect "$repository:$VERSION" --format '{{.Manifest.Digest}}')"
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
            reference="$repository:$VERSION@$digest"
            [[ "$reference" != *:latest@* ]]
            docker pull "$reference"
          done
