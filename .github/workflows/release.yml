name: release-appliance-images

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: quote-ops-agent
            dockerfile: deploy/appliance/Dockerfile
            build_args: |
              QUOTEOPS_SERVICE=agent
          - image: quote-ops-api
            dockerfile: deploy/appliance/Dockerfile
            build_args: |
              QUOTEOPS_SERVICE=api
          - image: quote-ops-web
            dockerfile: deploy/appliance/Dockerfile.web
            build_args: ""
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          # ponytail: amd64-only — QEMU arm64 flakes (esbuild hang, npm SIGILL);
          # arm64 needs native arm64 runners or npm cross-install (--cpu/--os/--libc)
          platforms: linux/amd64
          push: true
          build-args: ${{ matrix.build_args }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:latest
