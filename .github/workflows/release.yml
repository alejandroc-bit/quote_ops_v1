name: release-appliance-images

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test -- --run
      - run: bash deploy/appliance/tests/smoke.sh

  build-and-push:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: quote-ops-agent
            key: agent
            dockerfile: deploy/appliance/Dockerfile
            build_args: |
              QUOTEOPS_SERVICE=agent
          - image: quote-ops-api
            key: api
            dockerfile: deploy/appliance/Dockerfile
            build_args: |
              QUOTEOPS_SERVICE=api
          - image: quote-ops-web
            key: web
            dockerfile: deploy/appliance/Dockerfile.web
            build_args: ""
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          # ponytail: amd64-only — QEMU arm64 flakes (esbuild hang, npm SIGILL);
          # arm64 needs native arm64 runners or npm cross-install (--cpu/--os/--libc)
          platforms: linux/amd64
          push: true
          build-args: ${{ matrix.build_args }}
          tags: ghcr.io/alejandroc-bit/${{ matrix.image }}:${{ github.ref_name }}
      - name: Save pushed digest
        run: echo '${{ steps.build.outputs.digest }}' > ${{ matrix.key }}.digest
      - uses: actions/upload-artifact@v4
        with:
          name: appliance-${{ matrix.key }}-digest
          path: ${{ matrix.key }}.digest
          retention-days: 1

  collect-image-digests:
    needs: build-and-push
    runs-on: ubuntu-latest
    outputs:
      agent_digest: ${{ steps.digests.outputs.agent_digest }}
      api_digest: ${{ steps.digests.outputs.api_digest }}
      web_digest: ${{ steps.digests.outputs.web_digest }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: appliance-*-digest
          merge-multiple: true
      - id: digests
        name: Expose distinct application digests
        run: |
          set -euo pipefail
          for image in agent api web; do
            digest="$(cat "$image.digest")"
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
            echo "${image}_digest=$digest" >> "$GITHUB_OUTPUT"
          done

  verify-anonymous-pulls:
    needs: collect-image-digests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Require anonymously pullable immutable application images
        env:
          VERSION: ${{ github.ref_name }}
          AGENT_DIGEST: ${{ needs.collect-image-digests.outputs.agent_digest }}
          API_DIGEST: ${{ needs.collect-image-digests.outputs.api_digest }}
          WEB_DIGEST: ${{ needs.collect-image-digests.outputs.web_digest }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          for image_and_digest in \
            "quote-ops-agent:$AGENT_DIGEST" \
            "quote-ops-api:$API_DIGEST" \
            "quote-ops-web:$WEB_DIGEST"; do
            image="${image_and_digest%%:*}"
            digest="${image_and_digest#*:}"
            repository="ghcr.io/alejandroc-bit/$image"
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
            reference="$repository:$VERSION@$digest"
            [[ "$reference" != *:latest@* ]]
            docker pull "$reference"
          done
