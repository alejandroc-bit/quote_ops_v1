model:
  provider: openrouter
  model_name: nvidia/nemotron-3-ultra-550b-a55b:free
  temperature: 0
  api_key_env: OPENROUTER_API_KEY
authorization:
  tools:
    route.resolve:
      effect: read
      mode: allowed
    tms.searchHistorical:
      effect: read
      mode: allowed
    tms.writeQuoteResult:
      effect: write
      mode: allowed
    email.sendQuote:
      effect: send
      mode: approval_required
    approval.decide:
      effect: approve
      mode: approval_required
