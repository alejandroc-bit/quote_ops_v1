# TMS vía API HTTP (ejemplo: el mock TMS de este directorio).
# Instalar con: install.sh --tms-adapter-config deploy/appliance/mock-tms/tms-adapter.http.yaml
# y exportar QUOTEOPS_TMS_BASE_URL en el env/secretos del appliance, p.ej.:
#   http://mock-tms:8099   (contenedor en la misma red compose)
#   http://172.17.0.1:8099 (mock corriendo en el host del VPS)
provider: http
base_url_env: QUOTEOPS_TMS_BASE_URL
write_quote_endpoint_path: /quotes
write_status_endpoint_path: /status
